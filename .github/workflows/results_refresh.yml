name: results_refresh

on:
  schedule:
    - cron: "0 9 * * 1"  # Mon 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # Shared with bootstrap/weekly -- see weekly.yml's comment on this
  # same group name. All three commit-and-push to main; running two at
  # once can reject one's push as a non-fast-forward and silently drop
  # real work. One shared group serializes all three.
  group: kicktipp-repo-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh results and score last matchday's tips
        run: python -m src.results_refresh

      - name: Commit data + season tracker
        if: always()
        run: |
          git config user.name "kicktipp-bot"
          git config user.email "kicktipp-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "results_refresh: score matchday + update season tracker [skip ci]"
          git pull --rebase origin main
          git push
