name: weekly

on:
  schedule:
    # Fri 16:30 UTC -- fixed UTC, so DOES NOT shift for German DST:
    # 18:30 local (CEST, Aug-late Oct) or 17:30 local (CET, late Oct-Aug)
    # ahead of a typical 20:30 local Friday kickoff. 2-3h buffer either
    # way; left un-DST-adjusted deliberately (predict.py's 8-day fixture
    # window absorbs the difference -- see data/reports/diagnosis.md-style
    # notes in memory for the decision).
    - cron: "30 16 * * 5"
    # Tue 12:30 UTC -- 14:30 CEST / 13:30 CET, for midweek rounds.
    - cron: "30 12 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # Shared across bootstrap/weekly/results_refresh (not just this
  # workflow): all three commit-and-push to main, so any two running at
  # once can race and reject each other's push -- confirmed in practice
  # (a weekly run finished and pushed while bootstrap was still mid-run,
  # and bootstrap's own later checkpoint commit then got rejected as a
  # non-fast-forward, losing the lambda-table checkpoint and final
  # backtest results that were never re-pushed). One shared group
  # serializes all three so this can't happen again.
  group: kicktipp-repo-writer
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly prediction
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m src.predict

      - name: Commit data + report
        if: always()
        run: |
          git config user.name "kicktipp-bot"
          git config user.email "kicktipp-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "weekly: predictions + report [skip ci]"
          git pull --rebase origin main
          git push
